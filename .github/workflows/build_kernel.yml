name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if nothing changed'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      update_manager: ${{ steps.compare.outputs.update_manager }}
      update_module: ${{ steps.compare.outputs.update_module }}
    steps:
    - name: Compare upstream commits, manager CI and module CI
      id: compare
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eo pipefail
        KSU=$(git ls-remote https://github.com/tiann/KernelSU.git refs/heads/main | cut -f1)
        SUSFS=$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android14-6.1-dev | cut -f1)
        NOMOUNT=$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/dev | cut -f1)
        if [ -z "$KSU" ] || [ -z "$SUSFS" ] || [ -z "$NOMOUNT" ]; then exit 1; fi
        CURRENT="upstream: ksu=${KSU} susfs=${SUSFS} nomount=${NOMOUNT}"
        BODY=$(gh release view --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)
        LAST=$(echo "$BODY" | grep '^upstream:' || true)

        if [ "$CURRENT" != "$LAST" ] || [ "${{ inputs.force }}" = "true" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "update_manager=false" >> "$GITHUB_OUTPUT"
          echo "update_module=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "changed=false" >> "$GITHUB_OUTPUT"

        latest_success() {
          gh run list --repo "$1" --workflow "$2" --branch "$3" --status success \
            --limit 1 --json number -q '.[0].number' 2>/dev/null || true
        }
        is_newer() {
          [ -n "$1" ] && { [ -z "$2" ] || [ "$1" -gt "$2" ]; }
        }

        NEW_MGR=$(latest_success tiann/KernelSU "Build Manager" main)
        REL_MGR=$(echo "$BODY" | grep -o 'Build Manager #[0-9]*' | grep -o '[0-9]*$' || true)
        NEW_MOD=$(latest_success maxsteeel/nomount "build module" dev)
        REL_MOD=$(echo "$BODY" | grep -o 'build module #[0-9]*' | grep -o '[0-9]*$' || true)
        echo "Manager: release ${REL_MGR:-none}, latest ${NEW_MGR:-none}"
        echo "Module:  release ${REL_MOD:-none}, latest ${NEW_MOD:-none}"

        UPD_MGR=false
        UPD_MOD=false
        if is_newer "$NEW_MGR" "$REL_MGR"; then UPD_MGR=true; fi
        if is_newer "$NEW_MOD" "$REL_MOD"; then UPD_MOD=true; fi

        if [ "$UPD_MGR" = "false" ] && [ "$UPD_MOD" = "false" ]; then
          echo "update_manager=false" >> "$GITHUB_OUTPUT"
          echo "update_module=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        BUSY=false
        for ID in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow "${{ github.workflow }}" \
            --limit 20 --json databaseId,status \
            -q '.[] | select(.status != "completed") | .databaseId'); do
          [ "$ID" = "${{ github.run_id }}" ] && continue
          if gh run view "$ID" --repo "$GITHUB_REPOSITORY" --json jobs \
              -q '.jobs[] | select(.name == "build" and .status != "completed") | .name' | grep -q .; then
            BUSY=true
            break
          fi
        done

        if [ "$BUSY" = "true" ]; then
          echo "Kernel build in progress, skipping link updates."
          echo "update_manager=false" >> "$GITHUB_OUTPUT"
          echo "update_module=false" >> "$GITHUB_OUTPUT"
        else
          echo "update_manager=${UPD_MGR}" >> "$GITHUB_OUTPUT"
          echo "update_module=${UPD_MOD}" >> "$GITHUB_OUTPUT"
        fi
        
  update-links:
    needs: check
    if: needs.check.outputs.update_manager == 'true' || needs.check.outputs.update_module == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Update manager/module links on latest release
      env:
        GH_TOKEN: ${{ github.token }}
        UPD_MGR: ${{ needs.check.outputs.update_manager }}
        UPD_MOD: ${{ needs.check.outputs.update_module }}
      run: |
        set -eo pipefail
        latest_run() {
          gh run list --repo "$1" --workflow "$2" --branch "$3" --status success \
            --limit 1 --json number,url,headSha \
            -q '.[0] | "\(.url) \(.headSha) \(.number)"'
        }

        TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
        gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > body.md

        MGR_LINE=$(grep '^Manager (' body.md || true)
        MOD_LINE=$(grep '^Module (' body.md || true)

        if [ "$UPD_MGR" = "true" ]; then
          read -r URL SHA NUM <<< "$(latest_run tiann/KernelSU "Build Manager" main)"
          MGR_LINE="Manager (Build Manager #${NUM}, commit ${SHA:0:7}): ${URL}"
        fi
        if [ "$UPD_MOD" = "true" ]; then
          read -r URL SHA NUM <<< "$(latest_run maxsteeel/nomount "build module" dev)"
          MOD_LINE="Module (build module #${NUM}, commit ${SHA:0:7}): ${URL}"
        fi

        grep -v -e '^Manager (' -e '^Module (' body.md > new.md || true
        if [ -n "$MGR_LINE" ]; then echo "$MGR_LINE" >> new.md; fi
        if [ -n "$MOD_LINE" ]; then echo "$MOD_LINE" >> new.md; fi

        gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file new.md
        echo "Updated $TAG:"
        echo "  $MGR_LINE"
        echo "  $MOD_LINE"
  
  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: build-kernel
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write

    steps:
    - name: Skip if already built
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eo pipefail
        KSU=$(git ls-remote https://github.com/tiann/KernelSU.git refs/heads/main | cut -f1)
        SUSFS=$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android14-6.1-dev | cut -f1)
        NOMOUNT=$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/dev | cut -f1)
        if [ -z "$KSU" ] || [ -z "$SUSFS" ] || [ -z "$NOMOUNT" ]; then exit 1; fi
        CURRENT="upstream: ksu=${KSU} susfs=${SUSFS} nomount=${NOMOUNT}"
        LAST=$(gh release view --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null | grep '^upstream:' || true)
        if [ "$LAST" = "$CURRENT" ] && [ "${{ inputs.force }}" != "true" ]; then
          echo "Already released, cancelling."
          gh run cancel ${{ github.run_id }} --repo "$GITHUB_REPOSITORY"
          sleep 120
          exit 1
        fi
        
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 8192
        swap-size-mb: 8192
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-docker-images: 'true'

    - name: Install Repo
      run: |
        mkdir -p ~/bin
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
        chmod a+x ~/bin/repo
        echo "~/bin" >> $GITHUB_PATH

    - name: Configure Git
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"

    - name: Run Build Script
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eo pipefail
        
        rm -rf kernel
        mkdir kernel
        cd kernel

        wget -O manifest.xml https://ci.android.com/builds/submitted/16385437/kernel_aarch64/latest/raw/manifest_16385437.xml
        repo init -u https://android.googlesource.com/kernel/manifest --depth=1
        mv manifest.xml .repo/manifests/
        repo init -m manifest.xml --depth=1
        repo sync -c --no-clone-bundle --no-tags -j"$(nproc)"

        gh release download --repo topjohnwu/Magisk --pattern 'Magisk-v*.apk' -O magisk.zip
        unzip -q magisk.zip -d magisk_tmp
        mkdir magiskboot
        cp magisk_tmp/lib/x86_64/libmagiskboot.so magiskboot/magiskboot
        rm -rf magisk.zip magisk_tmp
        wget -qO magiskboot/boot.img "https://github.com/Vyomcool/boot.img/releases/download/shiba-cp4a.261105.040.a1/boot.img"

        curl -fsSL "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

        git clone --depth=1 --branch gki-android14-6.1-dev --single-branch https://gitlab.com/simonpunk/susfs4ksu.git
        cp ./susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/
        cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ./common/
        cp -r ./susfs4ksu/kernel_patches/fs/* ./common/fs/
        cp -r ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
        patch -d ./KernelSU -p1 < ./KernelSU/10_enable_susfs_for_ksu.patch
        patch -d ./common -p1 < ./common/50_add_susfs_in_gki-android14-6.1.patch
        rm ./KernelSU/10_enable_susfs_for_ksu.patch
        rm ./common/50_add_susfs_in_gki-android14-6.1.patch

        wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/bpf/bpf,baseband_guard/ } }' ./common/security/Kconfig

        curl -fsSL https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev

        KSU_SHA=$(git -C KernelSU rev-parse HEAD)
        SUSFS_SHA=$(git -C susfs4ksu rev-parse HEAD)
        NOMOUNT_SHA=$(git -C NoMount rev-parse HEAD)
        echo "BUILT_SHAS=upstream: ksu=${KSU_SHA} susfs=${SUSFS_SHA} nomount=${NOMOUNT_SHA}" >> $GITHUB_ENV

        rm common/android/abi_gki_protected_exports_aarch64
        rm common/android/abi_gki_protected_exports_x86_64
        touch common/android/abi_gki_protected_exports_aarch64
        touch common/android/abi_gki_protected_exports_x86_64

        cd common
        git add .
        git commit -m "Commit Changes"
        cd ..
        
        tools/bazel build --config=release --config=local //common:kernel_aarch64

        cp bazel-bin/common/kernel_aarch64/Image magiskboot/
        cd magiskboot
        chmod +x magiskboot
        ./magiskboot unpack boot.img
        mv -f Image kernel
        ./magiskboot repack boot.img
        
        DATE=$(date +'%Y-%m-%d')-run-${{ github.run_number }}
        cp -f new-boot.img $GITHUB_WORKSPACE/boot-${DATE}.img
        echo "BUILD_DATE=${DATE}" >> $GITHUB_ENV
    
    - name: Wait for in-progress Manager CI / Module CI
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eo pipefail
        PENDING=""
        for SPEC in "tiann/KernelSU|Build Manager|main|15" "maxsteeel/nomount|build module|dev|5"; do
          IFS='|' read -r REPO WF BRANCH MAX <<< "$SPEC"
          LATEST=$(gh run list --repo "$REPO" --workflow "$WF" --branch "$BRANCH" --limit 1 \
            --json databaseId,status -q '.[0] | "\(.databaseId) \(.status)"' || true)
          ID="${LATEST%% *}"
          STATUS="${LATEST#* }"
          if [ -n "$ID" ] && [ "$STATUS" != "completed" ]; then
            echo "$WF run $ID ($REPO) is $STATUS, waiting (max $MAX min)..."
            PENDING="$PENDING $REPO|$ID|$MAX"
          fi
        done

        if [ -z "$PENDING" ]; then
          echo "Nothing in progress."
          exit 0
        fi

        for MIN in $(seq 0 15); do
          STILL=""
          for P in $PENDING; do
            IFS='|' read -r REPO ID MAX <<< "$P"
            S=$(gh run view "$ID" --repo "$REPO" --json status -q .status || echo unknown)
            if [ "$S" = "completed" ]; then
              echo "$REPO run $ID completed after ~${MIN} min."
            elif [ "$MIN" -ge "$MAX" ]; then
              echo "$REPO run $ID still $S after ${MAX} min, giving up on it."
            else
              STILL="$STILL $P"
            fi
          done
          PENDING="$STILL"
          if [ -z "$PENDING" ]; then break; fi
          sleep 60
        done
    
    - name: Get Latest Manager / Module CI Runs
      id: links
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eo pipefail
        latest_run() {
          gh run list --repo "$1" --workflow "$2" --branch "$3" --status success \
            --limit 1 --json number,url,headSha \
            -q '.[0] | "\(.url) \(.headSha) \(.number)"' || true
        }

        RUN=$(latest_run tiann/KernelSU "Build Manager" main)
        if [ -n "$RUN" ]; then
          read -r URL SHA NUM <<< "$RUN"
          echo "manager=Manager (Build Manager #${NUM}, commit ${SHA:0:7}): ${URL}" >> "$GITHUB_OUTPUT"
        else
          echo "manager=Manager (main CI): not found" >> "$GITHUB_OUTPUT"
        fi

        RUN=$(latest_run maxsteeel/nomount "build module" dev)
        if [ -n "$RUN" ]; then
          read -r URL SHA NUM <<< "$RUN"
          echo "module=Module (build module #${NUM}, commit ${SHA:0:7}): ${URL}" >> "$GITHUB_OUTPUT"
        else
          echo "module=Module (dev CI): not found" >> "$GITHUB_OUTPUT"
        fi

    - name: Release Patched Boot Image
      uses: softprops/action-gh-release@v3
      with:
        body: |
          ${{ env.BUILT_SHAS }}

          ${{ steps.links.outputs.manager }}
          ${{ steps.links.outputs.module }}
        tag_name: boot-${{ env.BUILD_DATE }}
        name: Build ${{ env.BUILD_DATE }}
        files: boot-*.img
